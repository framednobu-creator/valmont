<script>
const {
  useState,
  useEffect,
  useRef,
  useCallback,
  useMemo
} = React;

/* ─────────────────────────────────────────────────────────────────────────────
   DESIGN TOKENS  — Cariter dark-gold palette
───────────────────────────────────────────────────────────────────────────── */
// ── Reactive theme store ──────────────────────────────────────────────────
window.__CT = {
  accent:      "#8a8a8a",
  accentDim:   "rgba(138,138,138,0.12)",
  accentGlow:  "rgba(138,138,138,0.30)",
  accentBorder:"rgba(138,138,138,0.25)",
};
const T = new Proxy({
  bg:          "#000000",
  panel:       "rgba(5,5,5,0.97)",
  card:        "rgba(10,10,10,0.90)",
  cardHover:   "rgba(18,18,18,0.97)",
  glass:       "rgba(255,255,255,0.028)",
  glassHover:  "rgba(255,255,255,0.055)",
  border:      "rgba(255,255,255,0.065)",
  borderHover: "rgba(255,255,255,0.13)",
  // gold → grey accent aliases (reactive)
  get gold()        { return window.__CT.accent; },
  get goldDim()     { return window.__CT.accentDim; },
  get goldGlow()    { return window.__CT.accentGlow; },
  get goldBorder()  { return window.__CT.accentBorder; },
  get accent()      { return window.__CT.accent; },
  get accentDim()   { return window.__CT.accentDim; },
  get accentGlow()  { return window.__CT.accentGlow; },
  get accentBorder(){ return window.__CT.accentBorder; },
  green:       "#969696",
  greenDim:    "rgba(150,150,150,0.10)",
  greenGlow:   "rgba(150,150,150,0.22)",
  red:         "#707070",
  redDim:      "rgba(90,90,90,0.14)",
  amber:       "#858585",
  amberDim:    "rgba(130,130,130,0.10)",
  purple:      "#909090",
  purpleDim:   "rgba(140,140,140,0.10)",
  purpleGlow:  "rgba(140,140,140,0.20)",
  pink:        "#aaaaaa",
  teal:        "#707070",
  tealDim:     "rgba(110,110,110,0.10)",
  text:        "#e0e0e0",
  textSub:     "rgba(220,220,220,0.50)",
  textDim:     "rgba(200,200,200,0.22)"
}, { get(obj, key) { return key in obj ? (typeof obj[key] === 'function' ? obj[key]() : obj[key]) : undefined; } });

/* ─────────────────────────────────────────────────────────────────────────────
   GLOBAL CSS
───────────────────────────────────────────────────────────────────────────── */
(() => {
  const s = document.createElement("style");
  s.textContent = `
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body,#root { height:100%; overflow:hidden; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter',system-ui,sans-serif;
      background:${T.bg}; color:${T.text};
      -webkit-user-select:none; user-select:none;
      -webkit-font-smoothing:antialiased;
    }
    input,textarea,select { -webkit-user-select:text; user-select:text; }
    ::-webkit-scrollbar { width:3px; height:3px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(150,150,150,0.20); border-radius:99px; }
    input::placeholder,textarea::placeholder { color:${T.textDim}; }

    @keyframes slideUp   { from{opacity:0;transform:translateY(18px) scale(0.96)} to{opacity:1;transform:none} }
    @keyframes slideIn   { from{opacity:0;transform:translateX(12px)} to{opacity:1;transform:none} }
    @keyframes popIn     { from{opacity:0;transform:scale(0.84)} to{opacity:1;transform:scale(1)} }
    @keyframes spin      { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes ping      { 0%{transform:scale(1);opacity:1} 80%,100%{transform:scale(2.3);opacity:0} }
    @keyframes pulse     { 0%,100%{opacity:.45} 50%{opacity:1} }
    @keyframes bounce    { 0%,80%,100%{transform:scaleY(.4);opacity:.3} 40%{transform:scaleY(1);opacity:1} }
    @keyframes liquid    { 0%,100%{transform:scale(1) rotate(0deg)} 33%{transform:scale(1.06) rotate(.9deg)} 66%{transform:scale(.95) rotate(-.9deg)} }
    @keyframes shimmer   { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    @keyframes goldPulse { 0%,100%{box-shadow:0 0 20px rgba(130,130,130,0.15)} 50%{box-shadow:0 0 40px rgba(130,130,130,0.35)} }
    @keyframes fadeIn    { from{opacity:0} to{opacity:1} }

    .spring { transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    .glass-card {
      background: ${T.card};
      border: 1px solid ${T.border};
      border-radius: 20px;
      backdrop-filter: blur(28px) saturate(1.5);
      -webkit-backdrop-filter: blur(28px) saturate(1.5);
    }
  `;
  document.head.appendChild(s);
})();

const CariterLogo = ({ size = 48, glow = true }) => {
  const canvasRef = React.useRef(null);
  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animId, rot = 0, t = 0;
    const DPR = window.devicePixelRatio || 1;
    const S = size * DPR;
    canvas.width = S; canvas.height = S;
    canvas.style.width = size + "px"; canvas.style.height = size + "px";
    const cx = S / 2, cy = S / 2, R = S * 0.46;

    // More continent detail — Africa, Europe, Asia, N.America, S.America, Australia, Greenland, Antarctica
    const CONTINENTS = [
      // Africa
      [[15,-34],[18,-30],[25,-30],[35,-27],[40,-20],[50,-10],[52,2],[48,10],[44,12],[40,18],[36,24],[32,32],[28,38],[24,38],[18,38],[14,36],[10,28],[6,18],[2,8],[-2,4],[-6,2],[-14,4],[-18,4],[-18,-12],[-14,-22],[-8,-28],[0,-34],[8,-36],[15,-34]],
      // Europe
      [[-10,36],[-6,37],[0,36],[6,38],[14,40],[20,38],[26,42],[30,46],[28,52],[22,56],[18,60],[14,58],[8,58],[4,52],[0,50],[-4,46],[-8,44],[-10,38],[-10,36]],
      // Asia
      [[26,42],[36,42],[44,40],[54,36],[64,30],[72,24],[80,20],[90,22],[100,20],[108,18],[116,24],[122,30],[128,36],[134,44],[140,46],[138,52],[132,58],[122,62],[108,68],[92,68],[76,68],[60,64],[48,60],[38,56],[32,52],[28,48],[26,42]],
      // North America
      [[-56,48],[-64,44],[-72,44],[-80,40],[-84,30],[-90,28],[-96,20],[-102,22],[-110,24],[-118,34],[-122,38],[-124,48],[-136,56],[-140,60],[-148,62],[-160,62],[-160,70],[-140,70],[-120,70],[-100,72],[-84,74],[-72,68],[-62,60],[-56,50],[-56,48]],
      // South America
      [[-36,-6],[-42,-4],[-50,-6],[-56,-10],[-62,-18],[-66,-30],[-68,-42],[-64,-50],[-56,-56],[-48,-52],[-42,-46],[-38,-36],[-34,-24],[-34,-12],[-36,-6]],
      // Australia
      [[114,-22],[120,-14],[128,-12],[132,-12],[138,-14],[144,-18],[150,-24],[152,-30],[150,-36],[144,-40],[138,-38],[130,-34],[122,-28],[116,-26],[114,-22]],
      // Greenland
      [[-44,60],[-36,62],[-24,68],[-20,72],[-26,80],[-40,82],[-54,80],[-58,74],[-56,68],[-50,64],[-44,60]],
      // Antarctica strip
      [[-180,-68],[180,-68],[180,-90],[-180,-90],[-180,-68]],
    ];

    function project(lon, lat) {
      const rl = (lon + rot) * Math.PI / 180;
      const rb = lat * Math.PI / 180;
      const x3 = Math.cos(rb) * Math.sin(rl);
      const y3 = Math.sin(rb);
      const z3 = Math.cos(rb) * Math.cos(rl);
      if (z3 <= 0) return null;
      return { x: cx + x3 * R, y: cy - y3 * R, z: z3 };
    }

    function draw() {
      ctx.clearRect(0, 0, S, S);
      t += 0.018;

      // ── Ocean ───────────────────────────────────────────────────────────
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
      const ocean = ctx.createRadialGradient(cx - R*0.25, cy - R*0.25, R*0.05, cx + R*0.1, cy + R*0.1, R);
      ocean.addColorStop(0, "rgb(22,22,22)");
      ocean.addColorStop(0.6, "rgb(10,10,10)");
      ocean.addColorStop(1,   "rgb(4,4,4)");
      ctx.fillStyle = ocean; ctx.fillRect(cx-R, cy-R, R*2, R*2);

      // ── Lat/lon grid ────────────────────────────────────────────────────
      const lw = Math.max(0.4, R * 0.012);
      for (let lat = -80; lat <= 80; lat += 15) {
        ctx.beginPath(); let first = true;
        for (let lon = -180; lon <= 180; lon += 2) {
          const p = project(lon, lat);
          if (!p) { first = true; continue; }
          first ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
          first = false;
        }
        ctx.strokeStyle = lat === 0 ? "rgba(100,100,100,0.28)" : "rgba(55,55,55,0.18)";
        ctx.lineWidth = lw; ctx.stroke();
      }
      for (let lon = -180; lon < 180; lon += 20) {
        ctx.beginPath(); let first = true;
        for (let lat = -88; lat <= 88; lat += 2) {
          const p = project(lon, lat);
          if (!p) { first = true; continue; }
          first ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
          first = false;
        }
        ctx.strokeStyle = "rgba(48,48,48,0.16)";
        ctx.lineWidth = lw; ctx.stroke();

      // ── Continents ──────────────────────────────────────────────────────
      for (const cont of CONTINENTS) {
        const mid = cont[Math.floor(cont.length / 2)];
        const midP = project(mid[0], mid[1]);
        if (!midP) continue;
        const z = midP.z;

        ctx.beginPath();
        let started = false;
        for (const [lon, lat] of cont) {
          const p = project(lon, lat);
          if (!p) { started = false; continue; }
          if (!started) { ctx.moveTo(p.x, p.y); started = true; }
          else ctx.lineTo(p.x, p.y);

        ctx.closePath();

        // Lit side bright grey, shadow side dark grey
        const bright = Math.floor(32 + z * 78);
        ctx.fillStyle = `rgb(${bright},${bright},${bright})`;
        ctx.fill();

        // Coast edge highlight
        const edge = Math.min(255, Math.floor(bright * 1.9));
        ctx.strokeStyle = `rgba(${edge},${edge},${edge},0.60)`;
        ctx.lineWidth = Math.max(0.5, R * 0.018); ctx.stroke();

      // ── Specular highlight (top-left) ──────────────────────────────────
      const spec = ctx.createRadialGradient(cx - R*0.32, cy - R*0.32, 0, cx, cy, R);
      spec.addColorStop(0,    "rgba(255,255,255,0.09)");
      spec.addColorStop(0.18, "rgba(220,220,220,0.04)");
      spec.addColorStop(1,    "rgba(0,0,0,0)");
      ctx.fillStyle = spec; ctx.fillRect(cx-R, cy-R, R*2, R*2);

      // ── Terminator shadow (opposite side) ─────────────────────────────
      const term = ctx.createRadialGradient(cx + R*0.42, cy + R*0.18, 0, cx, cy, R);
      term.addColorStop(0.40, "rgba(0,0,0,0)");
      term.addColorStop(0.62, "rgba(0,0,0,0.35)");
      term.addColorStop(0.82, "rgba(0,0,0,0.72)");
      term.addColorStop(1,    "rgba(0,0,0,0.92)");
      ctx.fillStyle = term; ctx.fillRect(cx-R, cy-R, R*2, R*2);
      ctx.restore();

      // ── Atmosphere rim ─────────────────────────────────────────────────
      const atm = ctx.createRadialGradient(cx, cy, R * 0.88, cx, cy, R * 1.20);
      atm.addColorStop(0,   "rgba(130,130,130,0.32)");
      atm.addColorStop(0.35,"rgba(80,80,80,0.13)");
      atm.addColorStop(0.7, "rgba(40,40,40,0.05)");
      atm.addColorStop(1,   "rgba(0,0,0,0)");
